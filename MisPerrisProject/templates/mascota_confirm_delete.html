<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eliminar mascota | Mis Perris</title>
    <style>
      body {
        margin: 0; font-family: "Segoe UI", Arial, sans-serif; background: #f5f6f1; color: #25312d;
      }
      .container { max-width: 640px; margin: 0 auto; padding: 32px 20px 60px; }
      .card {
        background: white; border: 1px solid #e6e8e1; border-radius: 20px; box-shadow: 0 10px 30px rgba(26,48,37,.06);
        padding: 30px;
      }
      h1 { margin-top: 0; }
      .button-row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 20px; }
      .button {
        border: 0; border-radius: 999px; padding: 12px 18px; font-weight: 700; cursor: pointer; text-decoration: none;
      }
      .button.danger { background: #a32323; color: white; }
      .button.secondary { background: #d8efb2; color: #194d3b; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <h1>Eliminar mascota</h1>
        <p>¿Estás seguro que deseas eliminar a <strong>{{ mascota.nombre }}</strong>?</p>
        <form method="post">
          {% csrf_token %}
          <div class="button-row">
            <button class="button danger" type="submit">Eliminar</button>
            <a class="button secondary" href="{% url 'mascotas' %}">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
